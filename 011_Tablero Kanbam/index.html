<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban - Gestor de Proyectos</title>
    <!-- Cargamos una tipografía elegante y moderna desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos de Google Fonts (Material Symbols Outline) para un look premium -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- BARRA LATERAL (SIDEBAR): Para navegación y estadísticas del proyecto -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="material-symbols-outlined logo-icon">grid_view</span>
                <h2>FlujoKanban</h2>
            </div>
            
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Tablero</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">analytics</span>
                    <span>Reportes</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Ajustes</span>
                </a>
            </nav>

            <!-- ESTADÍSTICAS RÁPIDAS: Muestra información en tiempo real de las tareas -->
            <div class="sidebar-stats">
                <h3>Resumen</h3>
                <div class="stat-box">
                    <span class="stat-label">Total Tareas</span>
                    <span id="total-tasks-count" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Alta Prioridad</span>
                    <span id="high-priority-count" class="stat-value text-red">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Completadas</span>
                    <span id="completed-tasks-count" class="stat-value text-green">0</span>
                </div>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL: Contiene el header y el tablero -->
        <main class="main-content">
            <!-- CABECERA: Buscador, filtros y botón para agregar tarea -->
            <header class="main-header">
                <div class="header-search">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="search-input" placeholder="Buscar tareas por título o etiqueta...">
                </div>
                
                <div class="header-actions">
                    <div class="filter-dropdown">
                        <select id="priority-filter">
                            <option value="all">Todas las prioridades</option>
                            <option value="high">Alta</option>
                            <option value="medium">Media</option>
                            <option value="low">Baja</option>
                        </select>
                    </div>
                    
                    <button id="btn-new-task" class="btn btn-primary">
                        <span class="material-symbols-outlined">add</span>
                        Nueva Tarea
                    </button>
                </div>
            </header>

            <!-- EL TABLERO KANBAN: Contenedor con 4 columnas principales -->
            <div class="kanban-board">
                <!-- COLUMNA: POR HACER -->
                <section class="board-column" data-status="todo">
                    <div class="column-header">
                        <div class="column-title-wrapper">
                            <span class="column-indicator indicator-todo"></span>
                            <h2>Por Hacer</h2>
                        </div>
                        <div class="column-actions">
                            <button class="btn-print-column" data-status="todo" title="Imprimir esta columna">
                                <span class="material-symbols-outlined">print</span>
                            </button>
                            <span class="column-count" id="count-todo">0</span>
                        </div>
                    </div>
                    <!-- El contenedor de tareas donde ocurrirá el Drag & Drop -->
                    <div class="task-list" id="list-todo"></div>
                </section>

                <!-- COLUMNA: EN PROGRESO -->
                <section class="board-column" data-status="inprogress">
                    <div class="column-header">
                        <div class="column-title-wrapper">
                            <span class="column-indicator indicator-inprogress"></span>
                            <h2>En Progreso</h2>
                        </div>
                        <div class="column-actions">
                            <button class="btn-print-column" data-status="inprogress" title="Imprimir esta columna">
                                <span class="material-symbols-outlined">print</span>
                            </button>
                            <span class="column-count" id="count-inprogress">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="list-inprogress"></div>
                </section>

                <!-- COLUMNA: EN REVISIÓN -->
                <section class="board-column" data-status="inreview">
                    <div class="column-header">
                        <div class="column-title-wrapper">
                            <span class="column-indicator indicator-inreview"></span>
                            <h2>En Revisión</h2>
                        </div>
                        <div class="column-actions">
                            <button class="btn-print-column" data-status="inreview" title="Imprimir esta columna">
                                <span class="material-symbols-outlined">print</span>
                            </button>
                            <span class="column-count" id="count-inreview">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="list-inreview"></div>
                </section>

                <!-- COLUMNA: COMPLETADO -->
                <section class="board-column" data-status="done">
                    <div class="column-header">
                        <div class="column-title-wrapper">
                            <span class="column-indicator indicator-done"></span>
                            <h2>Completado</h2>
                        </div>
                        <div class="column-actions">
                            <button class="btn-print-column" data-status="done" title="Imprimir esta columna">
                                <span class="material-symbols-outlined">print</span>
                            </button>
                            <span class="column-count" id="count-done">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="list-done"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- DIÁLOGO MODAL: Formulario nativo <dialog> para crear/editar tareas -->
    <dialog id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Crear Nueva Tarea</h2>
                <button type="button" id="btn-close-modal" class="btn-close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="task-form" method="dialog">
                <!-- Campo oculto para saber si estamos editando una tarea existente -->
                <input type="hidden" id="task-id" value="">
                
                <div class="form-group">
                    <label for="task-title-input">Título de la Tarea</label>
                    <input type="text" id="task-title-input" required placeholder="Ejem: Diseñar página de inicio">
                </div>

                <div class="form-group">
                    <label for="task-desc-input">Descripción</label>
                    <textarea id="task-desc-input" rows="3" placeholder="Escribe detalles del trabajo a realizar..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-priority-input">Prioridad: <span id="priority-value-display" style="font-weight: 600; color: #6366f1;">Media</span></label>
                        <input type="range" id="task-priority-input" min="1" max="3" value="2" step="1">
                    </div>

                    <div class="form-group">
                        <label for="task-date-input">Fecha Límite</label>
                        <input type="date" id="task-date-input">
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-tags-input">Etiquetas (separadas por comas)</label>
                    <input type="text" id="task-tags-input" placeholder="Ejem: Diseño, UX, Plantilla">
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="btn-submit-task" class="btn btn-primary">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="app.js" defer></script>
</body>
</html>
